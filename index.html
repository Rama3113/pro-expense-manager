
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#243b8a">
  <title>Pro Expense Manager</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5ff;
      color: #172554;
    }
    header {
      background: linear-gradient(135deg, #243b8a, #5269dc);
      color: white;
      padding: 28px 20px;
      border-radius: 0 0 24px 24px;
    }
    main {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 18px #17255412;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    .amount { font-size: 30px; font-weight: bold; }
    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pro Expense Manager</h1>
    <div>आपका अपना खर्च प्रबंधक</div>
  </header>
  <main>
    <section class="card">
      <div>ऑफलाइन ऐप सेटअप</div>
      <p class="amount">₹0.00</p>
      <p>अगले चरण में खर्च सेव करना और इंटरनेट आने पर Google Sheets से सिंक करना जोड़ेंगे।</p>
    </section>
  </main>
  <footer>Developed by Ramashray Yadav</footer>
</body>
</html>
